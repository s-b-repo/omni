[package]
name = "omni"
description = "The `omni` binary — agent harness whose runtime is itself editable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "omni"
path = "src/main.rs"

[dependencies]
omni-core = { workspace = true }
omni-ctx = { workspace = true }
serde_json = { workspace = true }
omni-model = { workspace = true }
omni-model-peregrine = { workspace = true }
omni-model-unifur = { workspace = true, optional = true }
omni-verify = { workspace = true }
omni-loop = { workspace = true }
omni-eval = { workspace = true }
omni-graph = { workspace = true }

[features]
# The `dblocks` backend — a Model impl that shells out to a built `dblocks`
# binary. Off by default so the default build still compiles without unifur
# in the picture. Flip it with `cargo build --features dblocks` or
# `cargo run --features dblocks -- model unifur …`.
default = []
dblocks = ["dep:omni-model-unifur", "omni-model-unifur/dblocks"]
